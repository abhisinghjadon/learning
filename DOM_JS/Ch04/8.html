<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .form-group {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .form-group label {
        font-weight: bold;
      }

      input {
        width: 250px;
        padding: 6px;
        box-sizing: border-box;
      }

      button {
        width: fit-content;
        padding: 8px 16px;
        cursor: pointer;
      }

      table {
        margin-top: 20px;
        width: 100%;
        border-collapse: collapse;
      }

      thead {
        background-color: black;
        color: white;
        font-size: medium;
      }

      td,
      th {
        border: 1px solid black;
        padding: 8px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Dynamic HTML Table Row Insertion</h1>

    <form action="" id="form">
      <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" />
      </div>

      <div class="form-group">
        <label for="age">Age:</label>
        <input type="text" id="age" />
      </div>

      <div class="form-group">
        <label for="course">Course:</label>
        <input type="text" id="course" />
      </div>

      <button type="submit">Submit</button>
    </form>

    <table>
      <thead>
        <tr>
          <th>S.No.</th>
          <th>Name</th>
          <th>Age</th>
          <th>Course</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <script src="8.js"></script>
  </body>
</html>
