<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drag and Drop</title>
    <style>
      #item {
        width: 100px;
        height: 40px;
        background-color: lightcoral;
        color: white;
        text-align: center;
        line-height: 40px;
        cursor: grab;
        margin-bottom: 20px;
      }
      #dro {
        width: 250px;
        height: 150px;
        border: 2px dashed #333;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <div id="item" draggable="true">Drag Me</div>

    <div id="dro">Drop Here</div>
    <script src="8.js"></script>
  </body>
</html>
