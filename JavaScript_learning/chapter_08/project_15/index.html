<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Project 15: Countdown Timer Tracker</h1>
    <h2>
      An input where the user sets target seconds, counting down to zero,
      showing an alert notification when finished.
    </h2>
    <label
      >Add Hours: <input type="number" placeholder="Enter Hours...." id="Hours"
    /></label>
    <br />
    <label
      >Add Minutes:
      <input type="number" placeholder="Enter Minutes...." id="Minutes"
    /></label>
    <br />
    <label
      >Add Seconds:
      <input type="number" placeholder="Enter Seconds...." id="Seconds"
    /></label>
    <br />
    <p id="err" style="display: none">Invalid Time!....</p>
    <button id="btn" onclick="addtime()">Add</button>
    <br />
    <div class="Container">
      <span id="hours">00</span>
      <span>:</span>
      <span id="minutes">00</span>
      <span>:</span>
      <span id="seconds">00</span>
      <span> </span>
      <span id="times"></span>
    </div>
    <center>
      <span id="note" style="display: none">Timer Complete !....</span>
    </center>
    <audio src="bell.wav" id="bell" controls loop style="display: none"></audio>
    <script src="script.js"></script>
  </body>
</html>
