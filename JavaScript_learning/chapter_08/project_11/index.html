  <body>
    <h2>
      Dynamic To-Do List Application: <br />Add task list items with individual

    </h2>
    <div id="myForm">
      <label
        ><b>Add Title:</b> <br />
        <input id="myTitle" type="text" /><br
      /></label>

      <label
        ><b>Add Discription</b>
        <br />
        <textarea id="myDiscription" cols="50" rows="5"></textarea>
      </label>
      <br />
      <button onclick="addnew()" id="btnSubmit">Add</button>
    </div>

          <th>Discription</th>

      <tbody>

          <th>--</th>
          <th>--</th>

        </tr>
      </tbody>
    </table>
