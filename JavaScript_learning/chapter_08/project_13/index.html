<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project 13</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Project 13: Digital Clock:</h1>
    <h2>
      A clock layout that updates hours, minutes, and seconds dynamically every
      single second using a interval timer.
    </h2>

    <div id="container">
      <span id="hours">00</span>
      <span>:</span>
      <span id="minutes">00</span>
      <span>:</span>
      <span id="seconds">00</span>
      <span> </span>
      <span id="times"></span>
    </div>
    <script src="script.js"></script>
  </body>
</html>
