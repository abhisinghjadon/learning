  <body>
    <h1>Project 23: GitHub User Profile Finder:</h1>
    <h2>
      Input fields where typing a username hits the public GitHub API and
      displays profile avatars, bio text, and repository counts inside a neat UI
      layout.
    </h2>
    <form id="form">
      <label
        >Enter Here:
        <input
          type="text"
          name="q"
          id="input"
          placeholder="Enter Github Username...."
      /></label>
      <button type="submit">Submit</button>
    </form>
    <script src="script.js"></script>
  </body>
